name: Create PR For Tag Update

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service Name
        required: true
      tag:
        description: Image Tag
        required: true
      ticket:
        description: Ticket Number
        required: true
      email_body:
        description: Email Body
        required: true

jobs:
  update-tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Create Branch and Update Tag
        env:
          SERVICE: ${{ github.event.inputs.service }}
          TAG: ${{ github.event.inputs.tag }}
          TICKET: ${{ github.event.inputs.ticket }}
        run: |
          set -e

          TARGET_BRANCH="main"
          YAML_FILE="config/${SERVICE}/envs/scapia-prod-01/values-scapia-prod-01.yaml"
          BRANCH_NAME="${TICKET}-${TAG}"

          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

          git checkout ${TARGET_BRANCH}
          git pull origin ${TARGET_BRANCH}

          git checkout -b ${BRANCH_NAME}

          sed -i 's/tag: ".*"/tag: "'"${TAG}"'"/' "${YAML_FILE}"

          git add "${YAML_FILE}"
          git commit -m "${TICKET} : update image tag for ${SERVICE}"

          git push origin "${BRANCH_NAME}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ github.event.inputs.service }}
          TAG: ${{ github.event.inputs.tag }}
          TICKET: ${{ github.event.inputs.ticket }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "${TICKET} : update tag for ${SERVICE}" \
            --body "Automated tag update

          Ticket: ${TICKET}
          Service: ${SERVICE}
          Tag: ${TAG}")

          echo "PR_URL=${PR_URL}" >> $GITHUB_ENV
          echo "Created PR: ${PR_URL}"
      
      - name: Set Date
        run: |
          echo "TODAY_DATE=$(date +'%d-%b-%Y')" >> $GITHUB_ENV

      - name: Send Email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_BODY: ${{ github.event.inputs.email_body }}
          TODAY_DATE: ${{ env.TODAY_DATE }}
        run: |
          python3 << 'EOF'
          import os
          import smtplib
          from email.message import EmailMessage
      
          msg = EmailMessage()
          msg["Subject"] = f"Deployment report cards-service - {os.environ['TODAY_DATE']}"
          msg["From"] = f"GitHub Actions <{os.environ['SMTP_USERNAME']}>"
          msg["To"] = "alurmohammed.yaseer@saven.in,nandu.puppala@saven.in"
          msg["Cc"] = "alekhya.pasala@saven.in,nayan.mittal@saven.in"
      
          msg.set_content(os.environ["EMAIL_BODY"])
      
          with smtplib.SMTP(os.environ["SMTP_HOST"], int(os.environ["SMTP_PORT"])) as server:
              server.starttls()
              server.login(
                  os.environ["SMTP_USERNAME"],
                  os.environ["SMTP_PASSWORD"]
              )
              server.send_message(msg)
      
          print("Email sent successfully")
          EOF
          
      - name: Workflow Summary
        if: always()
        run: |
          echo "Branch Name : ${BRANCH_NAME}"
          echo "PR URL      : ${PR_URL}"
